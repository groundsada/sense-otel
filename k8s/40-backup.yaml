---
# Nightly mirror of the primary buckets to the central RGW. Mimir, Tempo and
# Loki each take exactly ONE backend, so there is no dual-write and failover is
# manual -- see the runbook in README.md.
#
# `--remove` makes this a mirror, not a backup with history: it protects against
# losing the RGW, not against something deleting the data. Window is up to 24h.
# Same shape as the sense-dev obs-backup job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: obs-backup
  namespace: sense-viz
spec:
  schedule: "42 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mirror
              image: minio/mc:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  # Endpoints are bare hostnames; mc needs a scheme.
                  [ "${PRIMARY_ENDPOINT#http}" = "$PRIMARY_ENDPOINT" ] && PRIMARY_ENDPOINT="http://$PRIMARY_ENDPOINT"
                  [ "${FALLBACK_ENDPOINT#http}" = "$FALLBACK_ENDPOINT" ] && FALLBACK_ENDPOINT="http://$FALLBACK_ENDPOINT"
                  mc alias set primary  "$PRIMARY_ENDPOINT"  "$PRIMARY_AK"  "$PRIMARY_SK"
                  mc alias set fallback "$FALLBACK_ENDPOINT" "$FALLBACK_AK" "$FALLBACK_SK"
                  rc=0
                  for sig in tempo loki mimir; do
                    src="primary/mfsada-sense-viz-${sig}"
                    dst="fallback/mfsada-sense-viz-${sig}"
                    echo "== syncing ${src} -> ${dst}"
                    # One signal failing must not stop the others.
                    if mc mirror --overwrite --remove "${src}" "${dst}"; then
                      echo "  ok: ${sig}"
                    else
                      echo "  FAIL (continuing): ${sig}"
                      rc=1
                    fi
                  done
                  # Non-zero so a partial failure is not reported as success.
                  echo "backup complete (rc=${rc})"
                  exit $rc
              env:
                - name: PRIMARY_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: obs-s3
                      key: S3_ENDPOINT
                - name: PRIMARY_AK
                  valueFrom:
                    secretKeyRef:
                      name: obs-s3
                      key: AWS_ACCESS_KEY_ID
                - name: PRIMARY_SK
                  valueFrom:
                    secretKeyRef:
                      name: obs-s3
                      key: AWS_SECRET_ACCESS_KEY
                - name: FALLBACK_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: obs-s3-central
                      key: S3_ENDPOINT
                - name: FALLBACK_AK
                  valueFrom:
                    secretKeyRef:
                      name: obs-s3-central
                      key: AWS_ACCESS_KEY_ID
                - name: FALLBACK_SK
                  valueFrom:
                    secretKeyRef:
                      name: obs-s3-central
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: "100m"
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
