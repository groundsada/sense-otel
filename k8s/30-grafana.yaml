---
# Does NOT replace autogole-grafana, which stays primary (60+ dashboards, 11
# datasources, sense-rtmon writes into it). This one validates the push path
# alongside it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: sense-viz
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # One tenant for the fleet; `sitename` carries attribution. Per-site
      # tenants would mean 29 datasources and Loki cannot merge tenants in a
      # single query.
      - name: Tempo
        type: tempo
        uid: tempo-sense
        orgId: 1
        access: proxy
        url: http://tempo:3200
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          # Jump from a trace to the logs that trace produced.
          tracesToLogsV2:
            datasourceUid: loki-sense
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            tags:
              - key: sitename
        secureJsonData:
          httpHeaderValue1: "sense"

      - name: Loki
        type: loki
        uid: loki-sense
        orgId: 1
        access: proxy
        url: http://loki:3100
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          # Log line -> Tempo. Worthless until trace ids are real rather than
          # the trace_id=0 an inactive span produces.
          derivedFields:
            - name: TraceID
              matcherRegex: 'trace_id=(\w+)'
              url: '$${__value.raw}'
              datasourceUid: tempo-sense
        secureJsonData:
          httpHeaderValue1: "sense"

      - name: Mimir
        type: prometheus
        uid: mimir-sense
        orgId: 1
        access: proxy
        url: http://mimir:8080/prometheus
        isDefault: true
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: "sense"

      # Production Prometheus, read-only. Needed to prove forced parity: graph
      # scraped and pushed series in one panel and see them coincide.
      # Credentials come from the optional grafana-autogole secret.
      - name: Prometheus (autogole)
        type: prometheus
        uid: prom-autogole
        orgId: 1
        access: proxy
        url: https://autogole-prometheus.nrp-nautilus.io/
        basicAuth: true
        basicAuthUser: $${AUTOGOLE_PROM_USER}
        secureJsonData:
          basicAuthPassword: $${AUTOGOLE_PROM_PASSWORD}

      # Datasources the autogole dashboards read that are NOT and will not be in
      # LGTM. Carried here with the same uids so those dashboards import and
      # render unchanged. All optional -- Grafana provisioning tolerates a
      # datasource whose credentials are absent; panels using it error, the rest
      # of the dashboard works.

      # ESnet Stardust. External, ESnet-operated, index sd_public_interfaces.
      # 116 panel references. Nothing in this project will ever produce it.
      - name: ESnet
        type: elasticsearch
        uid: esnet-stardust
        orgId: 1
        access: proxy
        url: https://el.gc1.prod.stardust.es.net:9200
        database: sd_public_interfaces
        basicAuth: true
        basicAuthUser: $${ESNET_USER}
        secureJsonData:
          basicAuthPassword: $${ESNET_PASSWORD}

      # The end-to-end test harness. Nine of these exist in autogole; eight have
      # no backing pods, so only this one is carried. Cross-namespace ClusterIP,
      # verified reachable from sense-viz.
      - name: MySQL-ESnet
        type: mysql
        uid: mysql-esnet
        orgId: 1
        access: proxy
        url: run-endtoendesnet.opennsa.svc.cluster.local:3306
        user: $${E2E_MYSQL_USER}
        secureJsonData:
          password: $${E2E_MYSQL_PASSWORD}

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sense-viz
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sense-viz
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the data PVC is ReadWriteOnce, so a surge pod
  # cannot mount it while the old pod holds it and the rollout deadlocks.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:12.2.1
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://sense-viz.nrp-nautilus.io
            # Publicly reachable via ingress, so no anonymous access and no
            # self-signup.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: AUTOGOLE_PROM_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-autogole
                  key: username
                  optional: true
            - name: AUTOGOLE_PROM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-autogole
                  key: password
                  optional: true
            - name: ESNET_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-esnet
                  key: username
                  optional: true
            - name: ESNET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-esnet
                  key: password
                  optional: true
            - name: E2E_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-e2e-mysql
                  key: username
                  optional: true
            - name: E2E_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-e2e-mysql
                  key: password
                  optional: true
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: sense-viz
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
