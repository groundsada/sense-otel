---
# Pipeline lives in collector/config.yaml, mounted via the configMapGenerator.
apiVersion: v1
kind: Service
metadata:
  name: otlp-gateway
  namespace: sense-viz
spec:
  selector:
    app: otlp-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-gateway
  namespace: sense-viz
spec:
  # Tail sampling buffers a trace's spans in memory, so two replicas each see
  # only part of a trace. Scaling out needs a loadbalancing exporter in front.
  replicas: 1
  selector:
    matchLabels:
      app: otlp-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: otlp-gateway
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - --config=/conf/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 13133
              name: health
          env:
            - name: TENANT
              value: sense
            # Rate for traces that are neither errors nor slow; those are kept
            # unconditionally by the tail_sampling policies.
            - name: SAMPLE_PERCENT
              value: "10"
            # Not `sub` -- that is the service account UUID. Keycloak sets this
            # claim from a hardcoded per-client mapper.
            - name: OIDC_USERNAME_CLAIM
              value: sitename
          envFrom:
            - secretRef:
                name: gateway-oidc
          volumeMounts:
            - name: conf
              mountPath: /conf
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              # memory_limiter works off a percentage of this, so the two move
              # together.
              memory: 4Gi
      volumes:
        - name: conf
          configMap:
            name: otlp-gateway
