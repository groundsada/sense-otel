---
# TEMPLATE ONLY. Do not fill this in and commit it.
#
# Create the real secrets out of band, e.g.
#
#   kubectl create secret generic obs-s3 -n sense-viz \
#     --from-literal=AWS_ACCESS_KEY_ID=... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=... \
#     --from-literal=S3_ENDPOINT=rook-ceph-rgw-nautiluss3.rook
#
# OTLP auth needs no secret here. The gateway trusts a list of public issuer URLs
# from sites/registry.yaml; each frontend authenticates with its own host
# certificate and signs its own tokens.
#
# REPLACEME is the placeholder convention used elsewhere in this repository and
# is listed in .leakignore, so scanners do not flag these as leaked credentials.

apiVersion: v1
kind: Secret
metadata:
  name: obs-s3
  namespace: sense-viz
type: Opaque
stringData:
  # Object storage behind Mimir, Tempo and Loki. In-cluster RGW rather than the
  # public s3-west endpoint: same storage, but the traffic never leaves the
  # cluster.
  AWS_ACCESS_KEY_ID: REPLACEME
  AWS_SECRET_ACCESS_KEY: REPLACEME
  S3_ENDPOINT: REPLACEME

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: sense-viz
type: Opaque
stringData:
  admin-user: REPLACEME
  admin-password: REPLACEME
