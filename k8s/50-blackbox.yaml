---
# Reachability and certificate expiry, kept as an OUTSIDE observation.
#
# Everything else in this stack is pushed by the sites. probe_* and `up` cannot
# be: they are produced by the observer, not the target, and a site that has
# fallen over cannot push a metric saying so. Roughly 360 dashboard expression
# references depend on probe_*, and they are exactly the panels that must keep
# working during a migration -- they are what tells you a site is down.
#
# So the probes move here rather than retiring with the pull path. The target
# list is generated from sites/registry.yaml, the same file that decides which
# issuers the gateway trusts, so a site cannot be enrolled for OTLP and silently
# left unprobed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox
  namespace: sense-viz
data:
  blackbox.yml: |
    modules:
      # Matches the autogole `https_*` modules' intent: TLS required
      # (fail_if_not_ssl, https scheme), follow redirects, accept any 2xx, and
      # verify_none because several frontends present site-issued certificates
      # -- the point is reachability, not trust. Expiry is still reported via
      # probe_ssl_earliest_cert_expiry.
      #
      # Autogole pairs a *_V4 and a *_V6 job per site. Only the v4 half is
      # reproduced, because there is nothing for a v6 job to do here: pods in
      # this namespace get a link-local fe80:: address and no global IPv6, so
      # the cluster has no v6 egress. ip_protocol_fallback is left on and set
      # explicitly anyway -- it costs nothing and starts working by itself if
      # the cluster ever becomes dual-stack.
      #
      # Consequence, measured: 20 of 27 frontends probe green. The six FABRIC
      # frontends (*.exp.fabric-testbed.net) publish AAAA records ONLY and are
      # therefore unreachable from here, and T1_US_FNAL's :8443 is TCP-filtered
      # from this namespace though open to opennsa. Those seven read
      # probe_success == 0 for a reason that is about the observer's network,
      # not the site -- do not read them as a seven-site outage.
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: []
          method: GET
          follow_redirects: true
          fail_if_not_ssl: true
          preferred_ip_protocol: ip4
          ip_protocol_fallback: true
          tls_config:
            insecure_skip_verify: true
      # No icmp module. Autogole runs an *_ICMP_V4 job per site, but Gatekeeper
      # on this cluster refuses NET_RAW (allowed: NET_ADMIN, SYS_NICE,
      # NET_BIND_SERVICE, SYS_PTRACE, SETPCAP, SETFCAP, IPC_LOCK) and the icmp
      # prober cannot open a ping socket without it. Nothing is lost for the
      # ported rules: all three probe_* rules read the http probe.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: sense-viz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox
  template:
    metadata:
      labels:
        app: blackbox
    spec:
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.25.0
          args:
            - --config.file=/conf/blackbox.yml
          ports:
            - containerPort: 9115
              name: http
          volumeMounts:
            - name: conf
              mountPath: /conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: conf
          configMap:
            name: blackbox

---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
  namespace: sense-viz
spec:
  selector:
    app: blackbox
  ports:
    - name: http
      port: 9115
      targetPort: 9115

---
# A second, tiny collector: scrapes blackbox and remote-writes into Mimir.
#
# Deliberately NOT the gateway. The gateway authenticates every request against
# the issuer registry and tail-samples traces; this one scrapes and forwards and
# holds no credentials. Folding them together would mean the thing that decides
# whether a site is reachable shares a process with the thing that decides
# whether a site is who it says it is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-scraper
  namespace: sense-viz
data:
  config.yaml: |
    processors:
      batch:
        timeout: 5s

    exporters:
      # Same translation_strategy as the gateway, for the same reason: the
      # existing alert rules and panels match probe_success, not
      # probe_success_ratio or any suffixed variant.
      prometheus_remote_write/mimir:
        endpoint: http://mimir:8080/api/v1/push
        headers:
          X-Scope-OrgID: ${env:TENANT}
        translation_strategy: UnderscoreEscapingWithoutSuffixes
        retry_on_failure:
          enabled: true
          max_elapsed_time: 300s

    service:
      telemetry:
        logs:
          level: warn
      pipelines:
        metrics:
          receivers: [prometheus/probes]
          processors: [batch]
          exporters: [prometheus_remote_write/mimir]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-scraper
  namespace: sense-viz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-scraper
  template:
    metadata:
      labels:
        app: probe-scraper
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          # Two files, disjoint keys, same merge as the gateway. probes.yaml is
          # generated -- see scripts/gen-registry.py.
          args:
            - --config=/conf/config.yaml
            - --config=/conf/probes.yaml
          env:
            - name: TENANT
              value: sense
          volumeMounts:
            - name: conf
              mountPath: /conf
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: conf
          projected:
            sources:
              - configMap:
                  name: probe-scraper
              - configMap:
                  name: probe-targets
