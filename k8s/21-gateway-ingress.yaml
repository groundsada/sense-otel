---
# Public HTTPS for the 15 of 29 frontends that are not on NRP.
# Apply only after OIDC auth is verified; see README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otlp-gateway
  namespace: sense-viz
  annotations:
    haproxy-ingress.github.io/ssl-redirect: "true"
    haproxy-ingress.github.io/proxy-body-size: 32m
    haproxy-ingress.github.io/timeout-server: 120s
spec:
  ingressClassName: haproxy
  rules:
    - host: sense-otlp.nrp-nautilus.io
      http:
        paths:
          # 4318 (OTLP/HTTP), not 4317: gRPC needs end-to-end HTTP/2, which
          # institutional egress proxies break. Scoped to /v1 so health and the
          # 8888 metrics port stay unreachable from outside.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: otlp-gateway
                port:
                  number: 4318
  # No secretName: NRP's haproxy serves the *.nrp-nautilus.io wildcard, and
  # listing the host is all that is needed. There is no letsencrypt-prod
  # ClusterIssuer on this cluster.
  tls:
    - hosts:
        - sense-otlp.nrp-nautilus.io
