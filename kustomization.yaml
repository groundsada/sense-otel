---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sense-viz

resources:
  - k8s/10-mimir.yaml
  - k8s/11-tempo.yaml
  - k8s/12-loki.yaml
  - k8s/20-gateway.yaml
  - k8s/21-gateway-ingress.yaml
  - k8s/30-grafana.yaml
  - k8s/31-grafana-ingress.yaml
  - k8s/40-backup.yaml
  - k8s/50-blackbox.yaml
  - k8s/51-alert-rules.yaml

# Content hash in the ConfigMap name, so editing the pipeline rolls the gateway
# instead of waiting for an unrelated restart.
configMapGenerator:
  - name: otlp-gateway
    files:
      - config.yaml=collector/config.yaml
      - registry.yaml=collector/registry.yaml
  # Blackbox and probe scrape configs, generated from the same registry that
  # decides which issuers the gateway trusts.
  - name: probe-targets
    files:
      - probes.yaml=collector/probes.yaml
  # Dashboards provisioned from files, so editing one rolls grafana rather than
  # waiting up to updateIntervalSeconds for the provisioner to notice.
  #
  # A ConfigMap caps at ~1MB. That is fine for a curated set but will not hold
  # the full autogole dashboard library -- those come from sense-rtmon over the
  # API instead. Split into a second generator before that becomes a problem.
  - name: grafana-dashboards
    files:
      - siterm-push-path.json=dashboards/siterm-push-path.json

# Secrets are never generated from files here -- they are created by hand from
# k8s/01-secrets.example.yaml.
