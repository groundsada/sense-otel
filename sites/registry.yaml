# SiteRM frontend registry. Source of truth for OTLP auth and for the probes.
#
# Each frontend is its own OIDC issuer, so the gateway trusts many issuers rather
# than one. `scripts/gen-registry.py` turns this into collector/registry.yaml
# (the oidc providers and the issuer -> sitename map), collector/probes.yaml (the
# blackbox targets) and the env block a site pastes into /etc/environment.
# Generating them from one file is the point: a token whose `iss` does not match
# the gateway's provider list is rejected, and hand-maintaining parallel lists
# guarantees that eventually happens.
#
# `issuer` MUST be byte-identical to what the frontend publishes as `issuer` in
# its discovery document -- go-oidc compares the two exactly and a mismatch is
# fatal to the whole gateway, not just that site. It is NOT derivable by a rule:
# most frontends publish the explicit `:443`, but sense-nrp-internet2 and
# sense-fe publish without it. Every value below was read from the live
# discovery document. Run `scripts/gen-registry.py --verify` to re-check them.
#
# `enrolled: false` keeps a site in the probe target list while leaving it out of
# the oidc providers. That distinction is load-bearing: the oidc extension
# accumulates errors across every provider and refuses to start if ANY of them
# fails, so one unreachable issuer takes down ingest for the whole fleet. A site
# the gateway cannot reach is also a site whose JWKS it cannot fetch, so it could
# never verify that site's tokens anyway -- but it still wants to probe it, which
# is precisely how you find out the site is unreachable.
#
# Derived from the 29 *_STATE scrape jobs in the autogole prometheus config
# (opennsa/prometheus-config), which is the authoritative frontend list.
# `sitename` must keep matching the label those jobs stamp, or pushed and
# scraped series will not join.
#
# One coupling to keep in mind: `issuer` is also the probe target, so editing it
# changes the `instance` label and starts a new series. `https://host` and
# `https://host:443` probe the same endpoint, but their probe history does not
# join. Adding the explicit ports above did exactly that once, deliberately.

audience: sense-otlp

sites:
  - sitename: NRM_CENIC
    issuer: https://sense-ladowntown.nrp-nautilus.io:443
  - sitename: NRM_CENICDEV
    issuer: https://sense-dev-ladowntown.nrp-nautilus.io:443
  - sitename: NRM_GPN
    issuer: https://sense-gpn.nrp-nautilus.io:443
  # :8443 refuses connections from sense-viz (TCP refused, before any TLS) though
  # it is open to opennsa. The gateway cannot fetch this JWKS, so it cannot be
  # enrolled until that is opened; still probed, which is how the gap stays
  # visible.
  - sitename: T1_US_FNAL
    issuer: https://cmssense1.fnal.gov:8443
    enrolled: false
  - sitename: T2_US_Caltech
    issuer: https://sense-caltech-fe.tier2-lb.ultralight.org:443
  - sitename: T2_US_Caltech_DEV
    issuer: https://sense-dev-caltechprod.nrp-nautilus.io:443
  - sitename: T2_US_Caltech_Test
    issuer: https://sense-caltechtest.sdn-lb.ultralight.org:443
  - sitename: T2_US_MGHPCC
    issuer: https://sense-mghpcc.nrp-nautilus.io:443
  - sitename: T2_US_Nebraska
    issuer: https://red-sense-rm.unl.edu:10443
  - sitename: T2_US_SDSC
    issuer: https://sense-prpdev.nrp-nautilus.io:443
  - sitename: T2_US_SDSC_DEV
    issuer: https://sense-dev-sdsc.nrp-nautilus.io:443
  - sitename: T2_US_SDSC_OASISDEV
    issuer: https://sense-dev-oasis.nrp-nautilus.io:443
  - sitename: T2_US_SDSC_S63
    issuer: https://sense-t2-us-sdsc-s63.nrp-nautilus.io:443
  - sitename: T2_US_UCSD
    issuer: https://sense-t2-us-ucsd.nrp-nautilus.io:443
  - sitename: T2_US_UCSD_OASIS
    issuer: https://sense-oasis.nrp-nautilus.io:443
  - sitename: T2_US_UChicago
    issuer: https://sense.af.uchicago.edu:443
  # Placeholder in the scrape config too ("<yet to be added>"), so there is no
  # host to trust yet. Enrolling it is a one-line edit here plus a regenerate.
  - sitename: T2_US_Wisconsin
    issuer: null
  # The six *.exp.fabric-testbed.net frontends below publish AAAA records ONLY,
  # and pods in sense-viz get a link-local fe80:: address and no global IPv6 --
  # the cluster has no v6 egress, so neither the gateway nor the probes can
  # reach them. Enrolling any one of them prevents the gateway from starting at
  # all. They stay listed so the probe target list keeps them visible.
  - sitename: T3_FABRIC_AMST
    issuer: https://amst-sub1-gw1.exp.fabric-testbed.net
    enrolled: false
  - sitename: T3_FABRIC_CERN
    issuer: https://sense-cern-fabric.nrp-nautilus.io:443
  - sitename: T3_FABRIC_CERN1
    issuer: https://cern1-sub1-gw1.exp.fabric-testbed.net
    enrolled: false
  - sitename: T3_FABRIC_STAR
    issuer: https://star-sub1-gw1.exp.fabric-testbed.net
    enrolled: false
  # Scraped by IPv6 literal, with no hostname anywhere in the autogole config.
  # An issuer URL works here only if the frontend certificate carries an IP SAN
  # for this address, which is unusual. Needs a DNS name before it can enroll.
  - sitename: T3_US_FAB_Bluefield3
    issuer: null
  - sitename: T3_US_FAB_LOSA
    issuer: https://losa-sub1-gw1.exp.fabric-testbed.net
    enrolled: false
  - sitename: T3_US_FAB_NEWY
    issuer: https://newy-sub1-gw1.exp.fabric-testbed.net
    enrolled: false
  - sitename: T3_US_FAB_UCSD
    issuer: https://ucsd-sub1-gw1.exp.fabric-testbed.net
    enrolled: false
  # These two publish their issuer WITHOUT the explicit port, unlike the other
  # nrp-nautilus.io frontends. Do not "normalise" them.
  - sitename: T3_US_Internet2
    issuer: https://sense-nrp-internet2.nrp-nautilus.io
  - sitename: T3_US_NRP
    issuer: https://sense-fe.nrp-nautilus.io
  - sitename: T3_US_SL_400G
    issuer: https://g5intel2.it.northwestern.edu:8443
  - sitename: T3_US_Starlight
    issuer: https://r740xd4.it.northwestern.edu:8443

  # ---- sense-dev, the two-site development namespace ----------------------
  #
  # Not production frontends. They run in the sense-dev namespace on the same
  # Nautilus cluster as this gateway, so their issuer is an in-cluster FQDN
  # rather than a public https host: nothing outside the cluster needs to reach
  # them, and giving dev frontends public ingresses to satisfy OIDC would be the
  # wrong trade.
  #
  # These land in the blackbox probe list too -- probe targets are derived from
  # `issuer`, there is no separate URL field -- which is fine because blackbox
  # runs in-cluster and can resolve them. It does mean `probe_success` gains two
  # series that go hard down whenever sense-dev does.
  #
  # THE RISK, stated plainly: these issuers only resolve while the sense-dev
  # namespace exists. The oidc extension refuses to start if ANY provider fails,
  # so if sense-dev is torn down and this gateway restarts, ingest stops for
  # every site above. Set `enrolled: false` on both the moment sense-dev goes.
  - sitename: T9_US_MOHDEV_A
    issuer: http://service-siterm-fe-t9-us-mohdev-a-a1a1a1a1a1a1a1a1a1a1a1a1a1a1.sense-dev.svc.cluster.local:8443
  - sitename: T9_US_MOHDEV_B
    issuer: http://service-siterm-fe-t9-us-mohdev-b-b2b2b2b2b2b2b2b2b2b2b2b2b2b2.sense-dev.svc.cluster.local:8443
    enrolled: false
