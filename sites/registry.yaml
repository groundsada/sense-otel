# SiteRM frontend issuer registry. Source of truth for both sides of OTLP auth.
#
# Each frontend is its own OIDC issuer, so the gateway trusts 29 issuers rather
# than one. `scripts/gen-registry.py` turns this into collector/registry.yaml
# (the oidc providers and the issuer -> sitename map) and into the env block a
# site pastes into /etc/environment. Generating both from one file is the point:
# a token whose `iss` does not match the gateway's provider list is rejected, and
# hand-maintaining the two lists guarantees that eventually happens.
#
# `issuer` must be byte-identical to what the frontend puts in OIDC_ISSUER --
# go-oidc compares the discovery document's `issuer` field to the configured
# issuer_url exactly. The :443 is dropped here because that is the canonical URL
# form, and non-default ports are kept for the same reason.
#
# Derived from the 29 *_STATE scrape jobs in the autogole prometheus config
# (opennsa/prometheus-config), which is the authoritative frontend list.
# `sitename` must keep matching the label those jobs stamp, or pushed and
# scraped series will not join.

audience: sense-otlp

sites:
  - sitename: NRM_CENIC
    issuer: https://sense-ladowntown.nrp-nautilus.io
  - sitename: NRM_CENICDEV
    issuer: https://sense-dev-ladowntown.nrp-nautilus.io
