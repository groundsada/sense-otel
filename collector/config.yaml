# OTLP gateway for the SENSE fleet.
#
# Site identity comes from the credential, never from the payload: the gateway
# stamps `sitename` from the verified token and overwrites whatever the site
# sent. Same guarantee the autogole Prometheus gets from relabel_configs.
#
# The `oidc` extension and `transform/sitename` are NOT here -- they are
# generated into collector/registry.yaml from sites/registry.yaml and merged at
# startup. Both files are passed to the collector and hold disjoint keys.
#
# From the environment: TENANT, SAMPLE_PERCENT.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: oidc
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: oidc

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # `auth.subject` is the only usable source: the oidc extension exposes just
  # `subject` and `membership`, so `auth.claims.<name>` resolves to nothing and
  # leaves the attribute untouched. With `username_claim: iss` the subject is the
  # frontend's issuer URL, which transform/sitename then resolves to a name.
  #
  # `resource` not `attributes`, so one stamp covers traces, metrics and logs.
  resource/identity:
    attributes:
      - key: sitename
        from_context: auth.subject
        action: upsert

  # Metrics only. `resource_to_telemetry_conversion` on the remote-write
  # exporter is what turns `sitename` into a label, and it cannot be selective --
  # it promotes every resource attribute, so the SDK's own five arrive as labels
  # on all 1,870 dashboard references' worth of series. Dropping them here keeps
  # the pushed series comparable with the scraped one and keeps the cardinality
  # of a label set that is already wide.
  #
  # service.name and siterm.component are deliberately kept for traces and logs
  # -- Loki indexes the latter -- which is why this is a separate processor
  # rather than part of resource/identity.
  resource/metrics:
    attributes:
      - key: telemetry.sdk.language
        action: delete
      - key: telemetry.sdk.name
        action: delete
      - key: telemetry.sdk.version
        action: delete
      - key: service.version
        action: delete
      - key: siterm.component
        action: delete

  # Head sampling cannot work here: with no orchestrator above SiteRM every
  # trace is its own root and sites sample independently, so a 10% head rate
  # yields 10% of fragments that look like whole traces. Deciding after the
  # trace has arrived keeps or drops it as a unit.
  tail_sampling:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 5000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:SAMPLE_PERCENT}

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: ${env:TENANT}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: ${env:TENANT}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true

  # Remote-write rather than Mimir's OTLP endpoint purely for
  # translation_strategy: the default appends unit and `_total` suffixes, which
  # would miss all 67 existing alert rules and every dashboard panel. During the
  # dual-path period scraped and pushed series must be identical or parity
  # cannot be checked. Do not simplify this away.
  prometheus_remote_write/mimir:
    endpoint: http://mimir:8080/api/v1/push
    headers:
      X-Scope-OrgID: ${env:TENANT}
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

service:
  extensions: [health_check, oidc]

  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, transform/sitename, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, transform/sitename, resource/metrics, batch]
      exporters: [prometheus_remote_write/mimir]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, transform/sitename, batch]
      exporters: [otlp_http/loki]
